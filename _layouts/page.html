---
layout: default
---
<article class="post">

  {%- comment -%} hide_title: true のページ(トップページなど)ではタイトルを出さない {%- endcomment -%}
  {%- unless page.hide_title -%}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {%- endunless -%}

  <div class="post-content">
    {{ content }}
  </div>

</article>
