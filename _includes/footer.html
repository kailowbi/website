<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    {%- comment -%} サイト名が2回並んでいたため、名前1つ+説明文だけにする {%- endcomment -%}
    <h2 class="footer-heading p-name">{{ site.author.name | default: site.title | escape }}</h2>
    <p class="footer-description">{{- site.description | escape -}}</p>

    <p class="back-to-top">
      <a href="#" id="back-to-top-link">ページトップへ ▲</a>
    </p>

  </div>

</footer>

<script>
  (function () {
    var link = document.getElementById('back-to-top-link');
    if (!link) return;
    link.addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
</script>
