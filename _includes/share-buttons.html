<div class="share-buttons">
  <span class="share-buttons-label">この記事をシェア</span>
  <ul class="share-buttons-list">
    <li>
      <a href="https://b.hatena.ne.jp/entry/" class="hatena-bookmark-button" data-hatena-bookmark-layout="basic-label-counter" data-hatena-bookmark-lang="ja" title="このエントリーをはてなブックマークに追加"><img src="https://b.st-hatena.com/images/v4/public/entry-button/button-only@2x.png" alt="このエントリーをはてなブックマークに追加" width="20" height="20"></a>
    </li>
    <li>
      <a class="share-button-x" href="https://x.com/intent/post?url={{ page.url | absolute_url | uri_escape }}&amp;text={{ page.title | uri_escape }}" target="_blank" rel="noopener">X でポスト</a>
    </li>
  </ul>
</div>
<script src="https://b.st-hatena.com/js/bookmark_button.js" charset="utf-8" async></script>
