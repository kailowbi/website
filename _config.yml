title: kailowbi
description: kailowbi の個人サイト。技術メモや日々の記録を書いています。
theme: minima

primary_color: "#8f3a3a"

# 独自ドメインを使う場合はこのファイルと同じ内容の CNAME ファイルにも反映します
url: "https://beanz.click"

# ヘッダーに表示するナビゲーション(上から順に表示)
header_pages:
  - blog.html
  - about.md
  - privacy-policy.md

plugins:
  - jekyll-feed

markdown: CommonMarkGhPages
commonmark:
  options: ["SMART", "FOOTNOTES"]
  extensions: ["strikethrough", "autolink", "table", "tagfilter", "tasklist"]

# デフォルトの記事レイアウトなど
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
