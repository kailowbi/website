title: seihasync
lang: ja
locale: ja_JP
description: seihasync の個人サイト。技術メモや日々の記録を書いています。
theme: minima

primary_color: "#8f3a3a"

# 記事ページの日付表記(一覧と同じ YYYY-MM-DD にそろえる)
minima:
  date_format: "%Y-%m-%d"

# 独自ドメインを使う場合はこのファイルと同じ内容の CNAME ファイルにも反映します
url: "https://beanz.click"

# ヘッダーに表示するナビゲーション(上から順に表示)
header_pages:
  - blog.html
  - about.md
  - privacy-policy.md

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Google AdSense のパブリッシャー ID（ads.txt と同じもの。公開されてよい値）
adsense_client: ca-pub-4993198530161495

markdown: CommonMarkGhPages
commonmark:
  options: ["SMART", "FOOTNOTES", "UNSAFE"]
  extensions: ["strikethrough", "autolink", "table", "tagfilter", "tasklist"]

# デフォルトの記事レイアウトなど
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# サイトとして公開しないファイル（CLAUDE.md などがページとして出ないように）
exclude:
  - CLAUDE.md
  - README.md
  - bin/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .claude/
